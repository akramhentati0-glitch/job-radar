name: daily-job-radar
on:
  schedule: [{ cron: "0 6 * * *" }]   # 06:00 UTC = 07:00 Tunisia
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python run.py
        env:
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      - name: Email digest (skips itself if the SMTP secrets are not set)
        run: python digest.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
      - name: Commit data (keeps first_seen history)
        run: |
          git config user.name "job-radar"; git config user.email "job-radar@users.noreply.github.com"
          git add data/jobs.json site/jobs.json data/digest_sent.json 2>/dev/null || git add data/jobs.json site/jobs.json
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
